name = "solo-empire-checkin"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
account_id = "98e152b05e32b75612ee03e955913ee2"

# Public at https://solo-empire-checkin.bookchaowalit.workers.dev
# POST /telegram is the book_noti_bot webhook (secret header); GET /health is for the uptime monitor.
workers_dev = true

# 21:30 Asia/Bangkok = 14:30 UTC: the evening check-in prompt.
[triggers]
crons = ["30 14 * * *"]

# Cell origins (solo-empire cells on Railway). Secrets are set with `wrangler secret put`:
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, TELEGRAM_WEBHOOK_SECRET, EMPIRE_CHECKIN_TOKEN (rotated by platform-empire).
[vars]
HEALTH_ORIGIN = "https://health-api-production-c72f.up.railway.app"
TIME_ORIGIN = "https://time-api-production-2050.up.railway.app"
DIARY_ORIGIN = "https://diary-api-production-2db8.up.railway.app"
# SPEC-002: the cron checks the webhook registration against PUBLIC_ORIGIN and reports to the monitor.
# HEARTBEAT_TOKEN is a secret (Infisical /monitoring), set with `wrangler secret put`.
PUBLIC_ORIGIN = "https://solo-empire-checkin.bookchaowalit.workers.dev"
MONITOR_ORIGIN = "https://solo-empire-monitor.bookchaowalit.workers.dev"

# SPEC-002: every log line names the deployed version, and Workers Logs keep the lines (D-1 = a).
[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true

# Keep only the Worker's own console lines. Invocation logs can record request headers, and Telegram
# sends the webhook secret in X-Telegram-Bot-Api-Secret-Token (security review of b9b087d).
[observability.logs]
enabled = true
invocation_logs = false
